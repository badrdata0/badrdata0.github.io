<div class="profil">
  <img src="{{ site.photo | relative_url }}" alt="Photo de {{ site.nom }}">
  <h1>{{ site.nom }}</h1>
  <p>{{ site.bio }}</p>
  <nav class="liens">
  {%- for l in site.liens -%}
    <a href="{{ l.url }}" aria-label="{{ l.type }}" target="_blank" rel="noopener">
    {%- case l.type -%}
    {%- when "instagram" -%}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>
    {%- when "youtube" -%}<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4" fill="currentColor"/><path d="M10 9l5 3-5 3z" fill="#fff"/></svg>
    {%- when "linkedin" -%}<svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="4" fill="currentColor"/><path d="M7 10v7M7 7v.01M11 17v-7m0 3a3 3 0 016 0v4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    {%- when "email" -%}<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2" fill="currentColor"/><path d="M3 6l9 7 9-7" stroke="#fff" stroke-width="2" fill="none"/></svg>
    {%- when "x" -%}<svg viewBox="0 0 24 24"><path d="M4 4l16 16M20 4L4 20" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
    {%- when "tiktok" -%}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 3v11a4 4 0 11-4-4M14 3c0 3 2 5 5 5"/></svg>
    {%- else -%}{{ l.type }}
    {%- endcase -%}
    </a>
  {%- endfor -%}
  </nav>
</div>
