<!doctype html><html lang="fr"><head>{% include head.html %}</head>
<body><div class="essai">
  {%- assign cat = site.data.categories | where: "id", page.category | first -%}
  <a class="haut" href="{{ '/' | relative_url }}"><img src="{{ site.photo | relative_url }}" alt=""><span>{{ site.nom }}</span></a>
  <h1>{{ page.title }}</h1>
  <p class="meta">{% include date.html d=page.date %}{% if cat %}, dans <a href="{{ '/categories/' | append: cat.id | append: '.html' | relative_url }}">{{ cat.titre }}</a>{% endif %}</p>
  <article>{{ content }}</article>
</div></body></html>
